<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selecter</title>
    <style>
         /* Element Selector*/
        p{
            border: 2px solid red;
        }
         /* Id Selector*/
        #firstpara {
            color: red;
        }
         /* Class Selector*/
            .bgq{
                background-color: rgb(133, 220, 20);
            }
            /* Grouping Selector*/
            footer,span{
                background-color: pink;

            }
        
    </style>
</head>

<body>
    <h3>CSS Selectors</h3>
    <p id="firstpara" class="bgq">this is a simple paragrapg to demonstrate css selectors</p>
    <p>this is another simple paragrapg to demonstrate css selectors</p>
    <div>
        <p>this is yet a simple paragrapg to demonstrate css selectors</p>
        <span>this is span</span>
        <footer>this is footer</footer>
        
    </div>
</body>

</html>
