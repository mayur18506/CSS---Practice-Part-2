<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container {
            height: 1144px;
            width: 1800px;
            border: 2px solid black;
            display: flex;

            /* Flex properties for flex container */
            flex-direction: row;
            /* (default value is row) */
            /* flex-direction: column;
flex-direction: row-reverse;
flex-direction: column-reverse; */

            flex-wrap: wrap;
            /* flex-wrap: wrap-reverse; */

            /* flex-flow: row-reverse wrap; */

            /* justify-content: center;
               justify-content: space-between;
            /* justify-content: space-around; */
            /* justify-content: space-evenly; */

            /* align-items: center;
            align-items: flex-end;
            align-items: flex-start;
            align-items: stretch; */

        }

        .item {
            width: 200px;
            height: 200px;
            background-color: tomato;
            border: 2px solid green;
            margin: 10px;
            padding: 10px;
        }

        #item-1 {
            /* Flex proprties for a flex container */

            /* Higher the order, later it shows up in the container  */
            order: 2;

            /* flex-grow: 2; */
        }

        #item-2 {
            /* flex-grow: 3; */
            /* flex-shrink: 3; */
            flex-basis: 320px;
            /* When flex-direction: is set to row flex-basis: will control width
             When flex-direction: is set to row flex-basis: will control height */
             /* flex-direction: column; */

        }

        #item-3 {
            order: 14;
            flex: 2 2 200px;
            align-self: flex-start;
            align-self: flex-end;
            align-self: center;
        }
    </style>
</head>

<body>
    <h1>This is flexbox tutorial</h1>
    <div class="container">
        <div class="item" id="item-1">first box</div>
        <div class="item" id="item-2">second box</div>
        <div class="item" id="item-3">third box </div>
        <!-- /* <div class="item" id="item-4">fourth box</div>
        <div class="item" id="item-5">fifth box </div>
        <div class="item" id="item-6">sixth box </div> */ -->
    </div>
</body>

</html>
