<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes and Animations</title>
    <style>
        .container {
            background-color: greenyellow;
        }

        .box {
            background-color: green;
            width: 250px;
            height: 250px;
            position: relative;
            /* animation-name: Mayur1; */
            animation-name: Mayur2;
            /* animation-name: mayur1; */
            animation-duration: 8s;
            /* animation-iteration-count: infinite; */
            /* animation-fill-mode: alternate; */
            /* animation-timing-function: ease-is-out; */
            /* animation-delay: 3s; */
            /
            /* animation-direction: reverse; */

            /* This property is used to set the animation properties in a single line. */
            /* animation: animation-name animation-duration animation-timing-function animation-delay animation-iteration-count animation-fill-mode; */

            /* animation: mayur2 5s ease-in 1s 12 backwards; */

        }

        @keyframes Mayur2 {
            0% {
                top: 0px;
                left: 0px;

            }

            25% {
                top: 250px;
                left: 0px;
            }

            75% {
                top: 250px;
                left: 250px;
            }

            100% {

                top: 0px;
                left: 250px;
            }
        }

        @keyframes Mayur1 {
            from {
                width: 200px;

            }

            to {
                width: 1400px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            This is a box
        </div>
    </div>
</body>

</html>
