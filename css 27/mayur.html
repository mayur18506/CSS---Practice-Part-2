<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizibility and z-index</title>
    <style>
        .box {
            width: 170px;
            height: 170px;
            border: 2px solid black;

        }

        #box1 {
            background-color: green;
            position: relative;
            top: 49px;
            z-index: -35;
        }

        #box2 {
            background-color: rgb(204, 36, 10);
            position: relative;
            top: 14px;
            z-index: -165;
            /* z-index: Will work only for position :relative,absolute,fixed,or sticky */


            /* visibility: hidden; */
            /* will hide the element and the space */

            /* display: none; */
            /* will hide the element but will show its empty space */
        }

        #box3 {
            background-color: rgb(12, 63, 231);
        }

        #box4 {
            background-color: rgb(172, 223, 18);
        }
    </style>
</head>

<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>

</html>
