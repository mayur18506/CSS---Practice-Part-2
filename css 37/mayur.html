<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Transitions</title>
    <style>
        body {
            background-color: black;

        }

        #box {
            display: flex;
            height: 200px;
            width: 200px;
            background-color: red;
            justify-content: center;
            align-items: center;
            /* transition-property: background-color;
    transition-duration: 1s;
    transition-timing-function: ease-in-out;
    transition-delay: 2s; */

            /* Shorthand for the above properties */
            transition: all background-color 1s ease-in-out .3s;
        }

        #box:hover {
            background-color: green;
            height: 400px;
            width: 400px;
            border-radius: 45px;
            font-size: 45px;


        }
    </style>
</head>

<body>
    <H3>This is css Transitions tutorial</H3>
    <div class="container">
        <div id="box">
            This is my box
        </div>
    </div>
</body>

</html>
